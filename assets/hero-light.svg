<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Zakki Thoriq, software developer">
<style>
text{font-family:'Helvetica Neue','Segoe UI',Helvetica,Arial,'Liberation Sans',sans-serif}
.f1{animation:fl 7s ease-in-out infinite}.f2{animation:fl 9s ease-in-out -3s infinite}.f3{animation:fl 8s ease-in-out -5s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.f1,.f2,.f3{animation:none}}
</style>
<rect width="1200" height="380" rx="28" fill="#EEF1E8"/>
<g transform="translate(790 0)">
  <g class="f1"><circle cx="150" cy="130" r="92" fill="#C6F432"/></g>
  <g class="f2"><rect x="215" y="150" width="170" height="170" rx="40" fill="#E0E6D3"/><circle cx="300" cy="235" r="34" fill="none" stroke="#0F2A20" stroke-width="10"/></g>
  <g class="f3"><rect x="20" y="215" width="170" height="90" rx="45" fill="#0F2A20"/><circle cx="145" cy="260" r="24" fill="#C6F432"/></g>
</g>
<text x="64" y="74" font-size="22" font-weight="600" fill="#4C6256" letter-spacing="1">HELLO, I'M</text>
<text x="60" y="170" font-size="104" font-weight="800" letter-spacing="-4" fill="#0F2A20">Zakki</text>
<text x="60" y="266" font-size="104" font-weight="800" letter-spacing="-4" fill="#0F2A20">Thoriq<tspan fill="#C6F432">.</tspan></text>
<text x="64" y="336" font-size="24" fill="#4C6256">I build software, mostly small, mostly useful.</text>
</svg>