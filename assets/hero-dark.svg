<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Zakki Thoriq, software developer">
<style>
text{font-family:'Helvetica Neue','Segoe UI',Helvetica,Arial,'Liberation Sans',sans-serif}
.f1{animation:fl 7s ease-in-out infinite}.f2{animation:fl 9s ease-in-out -3s infinite}.f3{animation:fl 8s ease-in-out -5s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.f1,.f2,.f3{animation:none}}
</style>
<rect width="1200" height="380" rx="28" fill="#0D1712"/>
<clipPath id="hc"><rect width="1200" height="380" rx="28"/></clipPath>
<g clip-path="url(#hc)"><defs>
<pattern id="b5p" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="scale(1.15)">
<g fill="none" stroke="#E8EFDC" stroke-width="1.6" stroke-linecap="round">
<ellipse cx="32" cy="15" rx="8.5" ry="15"/><ellipse cx="32" cy="49" rx="8.5" ry="15"/>
<ellipse cx="15" cy="32" rx="15" ry="8.5"/><ellipse cx="49" cy="32" rx="15" ry="8.5"/>
<circle cx="32" cy="32" r="3.4"/>
</g>
<g fill="#E8EFDC"><circle cx="0" cy="0" r="2.2"/><circle cx="64" cy="0" r="2.2"/><circle cx="0" cy="64" r="2.2"/><circle cx="64" cy="64" r="2.2"/>
<circle cx="32" cy="3" r="1.4"/><circle cx="32" cy="61" r="1.4"/><circle cx="3" cy="32" r="1.4"/><circle cx="61" cy="32" r="1.4"/></g>
</pattern>
<linearGradient id="b5g" x1="1" y1="0.5" x2="0" y2="0.5"><stop offset="0" stop-color="#fff"/><stop offset="0.8" stop-color="#000"/></linearGradient>
<mask id="b5m"><rect width="1200" height="380" fill="url(#b5g)"/></mask>
</defs>
<rect width="1200" height="380" fill="url(#b5p)" opacity="0.14" mask="url(#b5m)"/></g>
<g transform="translate(790 0)">
  <g class="f1"><circle cx="150" cy="130" r="92" fill="#C6F432"/></g>
  <g class="f2"><rect x="215" y="150" width="170" height="170" rx="40" fill="#16241C"/><circle cx="300" cy="235" r="34" fill="none" stroke="#E8EFDC" stroke-width="10"/></g>
  <g class="f3"><rect x="20" y="215" width="170" height="90" rx="45" fill="#E8EFDC"/><circle cx="145" cy="260" r="24" fill="#C6F432"/></g>
</g>
<text x="60" y="150" font-size="104" font-weight="800" letter-spacing="-4" fill="#E8EFDC">Zakki</text>
<text x="60" y="246" font-size="104" font-weight="800" letter-spacing="-4" fill="#E8EFDC">Thoriq<tspan fill="#C6F432">.</tspan></text>
<text x="64" y="312" font-size="28" fill="#8DA396">Software developer. Rust, Java and JavaScript.</text>
</svg>