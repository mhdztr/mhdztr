<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="In the workshop: sweep — Storage cleaning that asks first.">
<style>
text{font-family:'Helvetica Neue','Segoe UI',Helvetica,Arial,'Liberation Sans',sans-serif}
.s1{animation:fl 8s ease-in-out infinite}.s2{animation:fl 9s ease-in-out -4s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.s1,.s2{animation:none}}
</style>
<rect width="1200" height="170" rx="22" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/>
<clipPath id="nc"><rect width="1200" height="170" rx="22"/></clipPath>
<g clip-path="url(#nc)">
  <defs>
<pattern id="b1p" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
<g fill="none" stroke="#111113" stroke-width="1.4" stroke-linecap="round">
<ellipse cx="32" cy="15" rx="8.5" ry="15"/><ellipse cx="32" cy="49" rx="8.5" ry="15"/>
<ellipse cx="15" cy="32" rx="15" ry="8.5"/><ellipse cx="49" cy="32" rx="15" ry="8.5"/>
<circle cx="32" cy="32" r="3.2"/>
</g>
<g fill="#111113"><circle cx="0" cy="0" r="2"/><circle cx="64" cy="0" r="2"/><circle cx="0" cy="64" r="2"/><circle cx="64" cy="64" r="2"/>
<circle cx="32" cy="3" r="1.3"/><circle cx="32" cy="61" r="1.3"/><circle cx="3" cy="32" r="1.3"/><circle cx="61" cy="32" r="1.3"/></g>
</pattern>
<linearGradient id="b1g" x1="1" y1="0.5" x2="0" y2="0.5"><stop offset="0" stop-color="#fff"/><stop offset="0.72" stop-color="#000"/></linearGradient>
<mask id="b1m"><rect width="1200" height="170" fill="url(#b1g)"/></mask>
</defs>
<rect width="1200" height="170" fill="url(#b1p)" opacity="0.05" mask="url(#b1m)"/>
  <!-- Minimalist drafting / toolmaker accents on right -->
  <g transform="translate(870 0)">
    <g class="s1"><circle cx="120" cy="85" r="66" fill="#EFEFF2" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/></g>
    <g class="s2"><rect x="30" y="55" width="70" height="70" rx="20" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/><circle cx="65" cy="90" r="14" fill="none" stroke="#2C2C30" stroke-width="2"/><circle cx="65" cy="90" r="4" fill="#2C2C30"/></g>
  </g>
</g>
<!-- Left content -->
<text x="54" y="47" font-size="16" font-weight="600" fill="#686870">In the workshop <tspan font-weight="400" fill="#686870"> · Rust · pushed 3d ago</tspan></text>
<text x="52" y="104" font-size="54" font-weight="700" letter-spacing="-2" fill="#111113">sweep</text>
<text x="54" y="142" font-size="19" font-weight="400" fill="#686870">Storage cleaning that asks first.</text>
<!-- Action disc on right -->
<g transform="translate(1120 85)">
  <circle cx="0" cy="0" r="28" fill="#111113" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/>
  <path d="M-7 7 L7 -7 M-3 -7 H7 V3" stroke="#F2F2F5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>